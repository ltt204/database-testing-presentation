[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers for test categorization
markers =
    feature04: Feature 04 - Punch In/Out tests
    feature05: Feature 05 - Timesheet Approval tests
    feature06: Feature 06 - Timesheet Status Flow tests
    feature07: Feature 07 - Reports & Analysis tests
    feature08: Feature 08 - Timesheet Entry tests
    smoke: Smoke tests for critical functionality
    regression: Full regression test suite
    boundary: Boundary value tests
    ui: UI/UX validation tests
    slow: Tests that take longer to execute

# Allure configuration
addopts =
    --verbose
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    -p no:warnings
    --tb=short
    --html=reports/pytest-report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution
# Run with: pytest -n auto
