[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Test paths
testpaths = tests

# Markers
markers =
    smoke: Smoke tests for critical functionality
    regression: Full regression test suite
    recruitment: Tests for Recruitment module
    performance: Tests for Performance Review module
    login: Tests for login functionality
    slow: Tests that take longer to execute
    rec01: Tests for REC01 - Vacancy Management
    rec02: Tests for REC02 - Candidate State Transitions
    rec03: Tests for REC03 - Candidate Information Management
    perf01: Tests for PERF01 - KPI Management
    perf02: Tests for PERF02 - Tracker Management
    perf03: Tests for PERF03 - Review Management
    xfail: Tests expected to fail due to known system bugs

# Logging
log_cli = true
log_cli_level = INFO
log_file = reports/test_execution.log
log_file_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
